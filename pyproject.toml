[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "PTH", "PT", "RUF", "T20", "ARG"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "E402"]
"run_pipeline.py" = ["T201"]
"setup_project.py" = ["T201"]
"tests/*" = ["ARG", "PT009", "PT018"]
"ui/*" = ["E402"]
"migrations/*" = ["E402", "E501"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.report]
fail_under = 70
show_missing = true


